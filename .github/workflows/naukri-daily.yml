name: Daily Naukri Profile Update

on:
  schedule:
    # Runs every day at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-naukri:
    runs-on: ubuntu-24.04 # Explicitly use a stable Ubuntu runner version

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Updated to Node.js 22 to clear the Node 20 deprecation warning

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Naukri Update Script
        env:
          CI: true
        run: npx tsx tests/naukri-update.ts